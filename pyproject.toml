[project]
name = "chrgd-content-studio"
version = "0.1.0"
description = "CHRGD content engine — turns a backlog of ideas into import-ready TikTok/Instagram carousels and a Metricool CSV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Pulled in by later milestones. Kept out of the base install so milestone 1
# stays lean and testable without paid SDKs or heavy media libraries.
llm = ["openai>=1.40", "httpx>=0.27"]
media = ["pillow>=10.0", "httpx>=0.27"]
# Video (M6) drives the `ffmpeg` binary directly (subprocess) and downloads
# clips over httpx — no heavy Python media wrapper needed. The one host
# requirement is ffmpeg on PATH (e.g. `apt-get install ffmpeg`).
video = ["httpx>=0.27"]
web = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "python-multipart>=0.0.9",
    "jinja2>=3.1",
    "itsdangerous>=2.1",
    "httpx>=0.27",
]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
chrgd = "chrgd.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chrgd*"]

[tool.setuptools.package-data]
chrgd = ["templates/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
