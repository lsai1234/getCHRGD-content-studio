[project]
name = "chrgd-content-studio"
version = "0.1.0"
description = "CHRGD content engine — turns a backlog of ideas into import-ready TikTok/Instagram carousels and a Metricool CSV."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
]

[project.optional-dependencies]
# Pulled in by later milestones. Kept out of the base install so milestone 1
# stays lean and testable without paid SDKs or heavy media libraries.
llm = ["anthropic>=0.40", "httpx>=0.27"]
media = ["pillow>=10.0", "httpx>=0.27"]
video = ["moviepy>=1.0.3", "ffmpeg-python>=0.2"]
dev = ["pytest>=8.0"]

[project.scripts]
chrgd = "chrgd.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["chrgd*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
