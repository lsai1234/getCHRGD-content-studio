# Carousel mechanics — the "blank canvas" door's template gallery.
# Each is a proven TikTok carousel format: the engine is constrained to the
# skeleton (one line per slide) instead of choosing a format freely.
# Add your own: any [mechanics.<key>] with a label, description and skeleton
# (one line per slide — skeletons can be any length; the engine may flex the
# count if the idea genuinely wants fewer or more).

[mechanics.myth_fact]
label = "Myth vs fact"
description = "Bust a belief your audience secretly suspects is wrong. Comment bait built in."
skeleton = [
    "The myth, stated confidently — the thing everyone believes",
    "Why it feels true / who spreads it",
    "The receipts — what's actually going on",
    "What to do instead (actionable)",
    "Punchline + comment trigger (who do you know who still believes this?)",
]

[mechanics.five_mistakes]
label = "5 mistakes"
description = "Listicle of errors the viewer is probably making. High saveability."
skeleton = [
    "Hook: 'X mistakes killing your <goal>' — make it personal",
    "Mistake 1 + the fix in one line",
    "Mistake 2 + the fix in one line",
    "Mistake 3 + the fix in one line",
    "The mistake that actually separates results + fix, then 'screenshot this before your next session'",
]

[mechanics.before_after]
label = "Before / after"
description = "Transformation arc — what changed and the one thing that drove it."
skeleton = [
    "The 'before' — raw, relatable, a bit uncomfortable",
    "The turning point — what they stopped believing",
    "The single change that mattered",
    "The 'after' — concrete, measurable, no fairy tale",
    "The takeaway the viewer can start today",
]

[mechanics.unpopular_opinion]
label = "Unpopular opinion"
description = "A hot take you can defend. Engineered for comment fights."
skeleton = [
    "The take, no hedging — make half the audience bristle",
    "The strongest objection, stated fairly",
    "Why the objection misses the point",
    "The evidence / experience that backs the take",
    "Double down + ask who disagrees",
]

[mechanics.read_before]
label = "Read this before…"
description = "Gatekeeper format — essential context before a common decision. Peak saveability."
skeleton = [
    "'Read this before you <common action>' — urgency without clickbait",
    "The thing nobody tells you upfront",
    "The trap most people fall into",
    "What the smart minority does differently",
    "Checklist recap + save-this-for-later prompt",
]

[mechanics.insider_mechanism]
label = "The real reason"
description = "Insider knowledge framing — the mechanism underneath what everyone gets told. Makes the viewer feel let in."
skeleton = [
    "'The real reason <X> works has nothing to do with what you were told' — a concrete, confident hook (no 'nobody tells you')",
    "The surface story everyone repeats",
    "The actual mechanism underneath, with a specific",
    "How to use it — the practical move it unlocks",
    "The one-line version to remember + 'send this to whoever still believes the old version'",
]

# Amp's charge cycle — the mascot journey. Every post is ONE charge cycle:
# a relatable drain event flattens Amp, the middle slides charge him back up,
# and the final slide lands fully charged on the product benefit. Selectable
# (not default) until test carousels prove it out; the per-slide charge arc and
# the locked character prompt live in chrgd/character.py.
[mechanics.amp_charge_cycle]
label = "Amp's charge cycle"
description = "Amp gets drained, gets charged, ends on the payoff. The mascot journey — one post, one charge cycle."
skeleton = [
    "The drain event, stated as Amp living it — the moment that flattens everyone (3pm slump, leg day, bad sleep, 2am match)",
    "Why it wipes you out — name the real mechanism, no lecture",
    "The fix starting to land — what actually turns it around",
    "The fix paying off — Amp visibly coming back up",
    "Fully charged payoff + CTA, signed off 'Stay amped.'",
]
