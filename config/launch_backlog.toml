# The launch backlog — the written content for the fortnight either side of go-live.
#
# Each entry is a seed row waiting to be captured: the concept, the show it
# belongs to, the mechanic it runs on, the campaign phase it is written for,
# and a suggested day relative to launch. `chrgd campaign seed` turns these
# into backlog rows with the route pre-stamped, so the build already knows the
# show, the format and the phase before anybody opens the studio.
#
#   chrgd campaign seed --phase prime      # queue the pre-launch run
#   chrgd campaign seed --all --dry-run    # see the whole calendar first
#
# `hook` is a STARTING POINT, not the final headline — the concept gate still
# generates rivals and picks a winner. It is here so the engine begins from a
# specific angle rather than a topic, which is the single biggest quality lever
# on a seed row.
#
# ─── The shape of the calendar ───────────────────────────────────────────────
#
# PRIME (day -14 → -4) sells nothing. At ~70 followers a countdown reaches
# nobody who cares, so the pre-launch fortnight is spent on pure reach that
# happens to plant one thought: *you don't actually know if what you're taking
# is doing anything.* That thought is the market for a recommendation quiz, and
# it is genuinely true, which is why it can be said honestly and often.
#
# TEASE (day -3 → -1) is three posts that earn their swipe first and mention
# the thing second.
#
# LAUNCH (day 0 → +7) is the same reach content with one ask bolted on: the
# quiz, by name, with the domain written out. Never "buy".
#
# SELL (day +8 →) is the steady state, including the objection posts — which
# are where the actual conversions come from once the novelty is gone.
#
# Day numbers are suggestions that keep each show on its own weekday; reorder
# freely. Nothing here quotes a price, a discount or a statistic, because
# nothing here is allowed to invent one.

# ═══════════════════════════════════════════════════════════════════════════
# PRIME — pure reach, zero selling
# ═══════════════════════════════════════════════════════════════════════════

[[posts]]
key = "prime_types"
phase = "prime"
day = -14
show = "the_stack"
mechanic = "archetype_sort"
category = "identity_exposure"
hook = "there are four types of supplement buyer and three of them are skint for no reason"
note = """Sort the audience into four supplement-buying types and name what each one gets wrong. The tub graveyard (buys on offer, finishes nothing). The mate's-recommendation lad (takes whatever the strongest bloke in the gym takes). The stacker (six things, no plan, couldn't tell you what any of them do). And the one who takes two boring things consistently and is quietly getting the most out of it. Go hardest at what each type was SOLD, not at the person. End on 'which one are you' — no product, no mention of anything coming."""
target_viewer = "18-30 UK gym-goer who owns supplements they can't justify"
pain_point = "spending money on tubs without knowing if any of it works"
core_tension = "everyone has a supplement routine; almost nobody can explain theirs"

[[posts]]
key = "prime_cupboard"
phase = "prime"
day = -13
show = "the_stack"
mechanic = "cupboard_audit"
category = "myth_fight"
hook = "your supplement cupboard, sorted into keep and bin"
note = """Walk one specific cupboard — four tubs, two open, none finished — and sort it item by item. Bin the fat burner. Bin the BCAAs if protein is already sorted. Keep creatine monohydrate. Keep protein powder, but as food rather than magic. Be brutal about what things cost and completely neutral about physiology. The post's authority comes from cutting more than it keeps."""
target_viewer = "someone with a cupboard of half-used tubs"
pain_point = "no idea which of the things they own is actually doing anything"
core_tension = "the cheapest thing in the cupboard is usually the one with the evidence"

[[posts]]
key = "prime_creatine"
phase = "prime"
day = -12
show = "straight_up"
ingredient = "creatine"
category = "education"
hook = "do you actually need creatine if you only train three times a week"
note = """The real question, answered plainly. Well-studied, cheap, monohydrate is the best-evidenced form and the one 'advanced' blends charge four times more to replace. Loading is optional. Name the myths — steroid, kidneys, cycling off — and correct them without drama. Sharp about what the industry charges for the fancy versions; neutral and reported about what it does."""
target_viewer = "three-times-a-week trainer wondering if creatine is for serious lifters only"
pain_point = "assuming the well-evidenced stuff is only for people who train more than them"

[[posts]]
key = "prime_receipts_protein"
phase = "prime"
day = -11
show = "receipts"
category = "myth_fight"
hook = "two tubs of protein, near-identical ingredients, £20 between them"
note = """A teardown of the GAP rather than of one tub — the clearest possible demonstration that supplement pricing is about branding. Open on the two prices. What's actually in them (near enough the same thing). What the gap buys: the label, the athlete on it, the shelf position, the flavour development. Nothing that enters your body. Scrupulously fair to the expensive one where it deserves it, and never names either. Punch at the pricing model, never at whoever bought the dear one."""
receipt_product = "two 1kg tubs of whey with near-identical ingredient lists"
receipt_price = "£25 and £45"
target_viewer = "the label-led shopper"
pain_point = "paying premium prices for flavouring and marketing"
core_tension = "the ingredient lists match; the prices don't"

[[posts]]
key = "prime_verdict_fatburner"
phase = "prime"
day = -10
show = "verdict"
category = "myth_fight"
hook = "fat burners: not worth it, and here's the bit they rely on you not knowing"
note = """The first ruling, and it rules against a category the shop could happily sell — which is the entire point of leading with it. NOT WORTH IT. The reasoning is money and marketing: it's mostly caffeine with a story on top, sold at several times the price of caffeine. The exception, named honestly: if you genuinely like the ritual and you're spending money you don't mind losing, that's a choice, not a mistake. The move: the cheap boring thing that does the same job. No selling, no quiz, comment CTA only."""
verdict_subject = "fat burners"
verdict_ruling = "not_worth_it"
verdict_reason = "it's caffeine with a story on top, priced like it isn't"
target_viewer = "someone with a fat burner in the basket"
pain_point = "paying a premium for caffeine and a claim"
core_tension = "the category most sold on hope is the one with least behind it"

[[posts]]
key = "prime_receipts_preworkout"
phase = "prime"
day = -9
show = "receipts"
category = "myth_fight"
hook = "a £45 tub of pre-workout, and where the £45 actually goes"
note = """The first teardown. Open on the real figure, then break it: the caffeine that's doing nearly all the work and costs pennies; the beta-alanine that causes the tingle people read as potency; the flavouring; the proprietary blend whose real job is hiding the doses; the sponsorship on the label. Punch entirely at the seller — the buyer was sold this cleverly by people who do it for a living. No brand named, no second figure invented. Comment CTA."""
receipt_product = "a 30-serving tub of branded pre-workout"
receipt_price = "£45"
target_viewer = "anyone who buys pre-workout on the label"
core_tension = "the tingle is a marketing accident people read as proof it's working"

[[posts]]
key = "prime_stop"
phase = "prime"
day = -8
show = "the_stack"
mechanic = "stop_buying"
category = "myth_fight"
hook = "three things to stop buying before you buy anything else"
note = """The anti-list, and the most important post of the pre-launch run — an account that tells people to buy less is the only kind anyone believes later. Fat burners. BCAAs on top of a decent protein intake. Anything sold on a proprietary blend. Be fair about why each one is believed before cutting it. Close on the boring cheap thing that's worth the money, understated. Comment ask only."""
target_viewer = "someone about to place another order"
pain_point = "buying the exciting thing instead of the working thing"

[[posts]]
key = "prime_preworkout"
phase = "prime"
day = -7
show = "straight_up"
ingredient = "caffeine"
category = "education"
hook = "is pre-workout just expensive coffee"
note = """Answer it honestly: caffeine is the best-evidenced thing in most tubs, it's dose-dependent, tolerance builds, and it peaks roughly 45-60 minutes in. A late session can genuinely cost you sleep. The tingle is beta-alanine and has nothing to do with the caffeine working. Then the industry line: half the price of a tub is flavour, marketing and a blend hiding the doses."""
target_viewer = "the 6pm-after-work trainer on their second scoop"
pain_point = "escalating scoops and blaming the product"

[[posts]]
key = "prime_session"
phase = "prime"
day = -6
show = "session"
category = "education"
hook = "a 40-minute full-body session for a packed 6pm gym"
note = """A genuinely useful saveable session card built for the constraint everyone actually has: 40 minutes, one gym, every rack taken. Goal-framed, not gender-labelled. State who it's for, how long it takes and what kit it needs on the opening slide. No jargon, no %1RM, no RPE. Nothing to do with supplements — this one is here to earn reach and saves, and that's the whole job."""
target_viewer = "beginner-to-intermediate training after work"
pain_point = "arriving at 6pm and finding everything in use"

[[posts]]
key = "prime_eaas"
phase = "prime"
day = -5
show = "straight_up"
ingredient = "eaas_bcaas"
category = "education"
hook = "do you need EAAs if you're already hitting your protein"
note = """Short answer: if you're hitting a reasonable daily protein target from food or whey, the case is weak, and for BCAAs weaker still. Say so plainly. Then the industry point — this is one of the clearest examples of a category kept alive by marketing rather than evidence. Report the physiology neutrally; be pointed about the marketing."""
target_viewer = "someone sipping aminos through their session"

[[posts]]
key = "prime_livewire"
phase = "prime"
day = -4
show = "live_wire"
category = "topical"
hook = ""
note = """Topical — run the trend scout the morning it's due rather than pre-writing it, and take the gym angle on whatever's actually live that week in UK gym culture, big fitness news, new science, football, reality TV or money. The leap is the product: never just report the thing. No mention of the launch."""
