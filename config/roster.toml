# THE MULTIVERSE's cast — the approved roster (D15).
#
# From MULTIVERSE_ROSTER.md, agreed at twelve. The engine casts ONLY from this
# file: "never free-pick a person" is one of the likeness rules, and this is
# where that rule is actually enforced (chrgd/likeness.py checks every named
# character against these keys).
#
# `class` decides which rules apply:
#   meme_character — a public meme with no rights holder. Only taste applies.
#   public_figure  — a real living person. The full likeness gate applies:
#                    caricature never photoreal, no endorsement, no fabricated
#                    quotes, punch at status and situation only.
#   fictional_ip   — a character someone owns. Parody has latitude, but it must
#                    be OUR drawing, never a copy of the original design.
#
# `trait` is the entry. A character without a joke engine is a costume and dies
# at episode two. `visual` is the locked comic-style prefix, held identical on
# every render — the same trick chrgd/character.py uses on Amp.
#
# `catchphrase` and `bits` are the SEED jokes: specific, reusable gags a
# character starts with, so episode one already has material rather than the
# engine inventing a personality from one sentence. Bits the show actually
# lands get added to the canon per character as it goes (chrgd/series.py), so
# the roster is where a character begins and the canon is what they become.

[world]
location = "Iron Palace — Unit 4, a retail park, between a Greggs and a vape shop"
detail = "A 24/7 mid-tier gym that, for reasons nobody ever explains, is the fixed point every reality leaks into. One squat rack short. The lat pulldown has said BACK SOON since 2019. A single working hairdryer."
engine = "The gym is the only place in the multiverse where nobody gets special treatment. A god, a Premier League striker and a sentient banana all wait for the same bench. Every episode is a status contest the room refuses to settle."
voice = "Comic-book narration boxes — dry, deadpan, third person — plus speech bubbles for the characters. Never a TikTok voiceover; the comic register IS the format."
max_cast = 4

# ── Tier 1 — the regulars ────────────────────────────────────────────────────

[characters.tralalero]
name = "Tralalero Tralala"
class = "meme_character"
what = "A three-legged shark in Nike trainers."
trait = "Has three legs and still skips leg day, and will not discuss it."
role = "The cardio guy. Treadmill only. Owns the gym's fastest 5k and mentions it hourly."
visual = "A blue cartoon shark standing upright on three legs, each in a white trainer, bold comic ink outlines, halftone shading."
catchphrase = "Sub-nineteen, that. Sub-nineteen."
# Signature running gags — the concrete jokes, not just the trait.
bits = [
    "Announces his 5k time in conversations that were not about running",
    "Wears trainers on all three legs and has never once explained the third",
    "Calls the leg press 'the machine I don't need'",
]

