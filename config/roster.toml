visual = "A ballerina in a pink tutu with an oversized coffee-cup head with a face, en pointe, comic ink and halftone."
catchphrase = "You just need a bit more."
# Signature running gags — the concrete jokes, not just the trait.
bits = [
    "Doubles the scoop for anyone who admits to being tired",
    "Is the only one who saw what happened at 4am and cannot stop talking about it",
    "Pirouettes while explaining something serious, and nobody mentions it",
]

