# CHRGD brand styling — the single place that controls the carousel look.
# Point the font paths at your real brand fonts when you have them; the
# DejaVu defaults are freely licensed and always present on the VPS.

[canvas]
width = 1080          # final export width (<=1080p, TikTok-safe)
# 2:3 — matches the gpt-image-2 generation size below EXACTLY, so an
# AI-designed slide is resized (never cropped) onto the canvas. A 4:5 canvas
# against a 2:3 generation cropped the top/bottom and sliced titles off.
height = 1620
format = "jpeg"       # jpeg or webp — NEVER png (TikTok's API rejects png)
save_quality = 90     # JPEG/WebP quality 1-100

[generation]
# gpt-image-2 vertical size; the background is resized/cropped to the canvas.
size = "1024x1536"
# Per-slide quality (low / medium / high / auto) — drives image API cost.
# Slide 1 is the scroll-stopper (medium); the rest are low to keep spend down.
quality_first = "medium"
quality_rest = "low"
# Options generated for slide 1 (paid per option). 1 = one image per slide.
variants_first = 1
# "ai_design": gpt-image-2 designs the WHOLE slide — every word of text is
#              generated and baked into the artwork by the image API, never
#              overlaid in code. This is the only supported mode: all image
#              text must come from the API. (Legacy "branded"/"overlay" hints
#              are accepted by the API but ignored — see render_mode_for_idea.)
render_mode = "ai_design"

# --- Brand identity: the fixed CHRGD furniture on every branded slide ---------
[identity]
wordmark = "CHRGD"       # two-tone text wordmark
wordmark_split = 3       # first 3 chars ("CHR") in the accent colour
logo_path = ""           # drop in a PNG logo here to override the text wordmark
handle = "@getchrgd"     # bottom-corner handle
show_counter = true      # "1/5" slide counter
scrim = true             # top+bottom legibility gradient over the photo
footer_bar = true        # thin CHRGD light-blue line along the bottom edge
# Appended to every slide prompt so the five backgrounds read as ONE carousel.
consistency_clause = "Part of a 5-image set: keep the same location, lighting, colour grade and photographic style across all images in this set."
# Text is always overlaid in code — the model must never paint its own.
negative_clause = "Absolutely no text, no words, no letters, no numbers, no captions, no watermarks anywhere in the image."

# --- Art-direction presets (create journey "style" picker) -------------------
# One is chosen per post and appended to every slide's image prompt.
[styles.gritty]
label = "Gritty gym flash-photo"
prompt = "Shot on a phone with harsh direct flash in a real UK commercial gym at night, candid documentary energy, slightly grainy, dark moody background, authentic not staged."

[styles.editorial]
label = "Clean editorial"
prompt = "Premium editorial sports photography, controlled studio-grade lighting, deep blacks with a single cool light-blue accent, crisp detail, minimal composition with generous negative space."

[styles.meme]
label = "Meme-adjacent"
prompt = "Deliberately mundane amateur photo look, awkward framing, fluorescent gym lighting, the visual language of a viral relatable meme, slightly cursed energy."

[styles.cinematic]
label = "Dark cinematic"
prompt = "Cinematic film still, anamorphic depth, volumetric light cutting through chalk dust in a dark gym, cool blue-and-black grade, icy light-blue highlights, high contrast, dramatic atmosphere."

# --- Embedded typography (words rendered as part of the scene) ---------------
# When a slide's copy is short and punchy, the image model can render the words
# AS a real object in the shot (chalk on the floor, formed from plates, gym
# neon, a sign the character holds) instead of a flat caption bar. Denser
# slides (long copy or a reader `body` block) always use clean, legible type.
[typography]
embed_when_appropriate = true
# Max headline+supporting length for a slide to qualify for embedded type.
# Above this the copy needs clean legibility more than a creative treatment.
embed_max_chars = 90
# The brand's palette of ways to turn words into part of the CHRGD gym world.
embed_prompt = "Render the words as a tangible part of the CHRGD gym world rather than a flat caption: e.g. spelled in chalk dust on the floor or a plate, formed from stacked weights, sprayed on a wall, glowing in gym neon or LED signage, written on the whiteboard by the water fountain, printed on a shaker or supplement label, or on a sign the recurring character holds. The typography is a real object in the shot — physically lit and placed in the scene — never a floating overlay."

[safe_zones]          # fractions of the canvas kept clear of TikTok UI
top = 0.10
right = 0.18
bottom = 0.24
left = 0.08

[colors]
background = "#0B0B0D"   # near-black brand base
headline = "#FFFFFF"
supporting = "#E6E6E6"
accent = "#4FC3F7"       # CHRGD light blue
accent_alt = "#8FD9F7"   # lighter blue tint
panel = "#000000"        # contrast panel behind text
panel_opacity = 0.55     # 0 = none, 1 = solid

[fonts]
headline = "/usr/share/fonts/truetype/dejavu/DejaVuSans-Bold.ttf"
supporting = "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
headline_size = 74
supporting_size = 38
line_spacing = 1.15

[text]
headline_max_lines = 4
accent_bar = true        # draw a short accent bar under the headline
