<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CHRGD Content Studio{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='4' fill='%234FC3F7'/%3E%3Ctext x='8' y='12' font-size='10' font-weight='bold' text-anchor='middle' fill='%23081018'%3EC%3C/text%3E%3C/svg%3E">
  <style>
    :root {
      /* ── palette: layered dark surfaces + a sky-blue accent ── */
      --bg:#080a0d; --bg-2:#0b0e12;
      --panel:#14171c; --panel-2:#181c22; --raise:#1d222a;
      --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.14);
      --fg:#f3f6f9; --muted:#98a2ad; --faint:#6a7480;
      --accent:#4FC3F7; --accent2:#8FD9F7; --accent-ink:#08131c;
      --accent-tint:rgba(79,195,247,.12); --accent-tint-2:rgba(79,195,247,.18);
      --accent-line:rgba(79,195,247,.55); --accent-glow:rgba(79,195,247,.45);
      --good:#56d364; --bad:#ff6b6b; --warn:#e3b341;
      /* radii · shadows · motion */
      --r-sm:9px; --r:13px; --r-lg:16px; --r-xl:22px;
      --sh-1:0 1px 2px rgba(0,0,0,.35);
      --sh-2:0 10px 30px -12px rgba(0,0,0,.55), 0 2px 8px -4px rgba(0,0,0,.4);
      --sh-pop:0 30px 70px -20px rgba(0,0,0,.75), 0 8px 24px -12px rgba(0,0,0,.5);
      --ring:0 0 0 3px var(--accent-tint-2);
      --ease:cubic-bezier(.4,0,.2,1); --ease-out:cubic-bezier(.22,1,.36,1);
    }
    * { box-sizing:border-box; }
    ::selection { background:var(--accent-tint-2); }
    /* overflow-x:hidden on the root clips any residual horizontal blowout
       (iOS Safari -webkit-line-clamp/flex quirks) without breaking the
       sticky header. */
    html { -webkit-text-size-adjust:100%; overflow-x:hidden; }
    img, svg, video { max-width:100%; }
    body { margin:0; color:var(--fg);
      font:15px/1.55 -apple-system,BlinkMacSystemFont,"Inter","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
      -webkit-font-smoothing:antialiased; text-rendering:optimizeLegibility;
      background:
        radial-gradient(1100px 620px at 82% -8%, rgba(79,195,247,.09), transparent 60%),
        radial-gradient(900px 520px at 8% 0%, rgba(79,195,247,.05), transparent 55%),
        var(--bg);
      background-attachment:fixed; }

    /* ── header / nav ── */
    header { position:sticky; top:0; z-index:30;
      display:flex; align-items:center; justify-content:space-between; flex-wrap:wrap; gap:10px;
      padding:13px 24px; border-bottom:1px solid var(--line);
      background:rgba(10,12,15,.72); backdrop-filter:saturate(140%) blur(14px);
      -webkit-backdrop-filter:saturate(140%) blur(14px); }
    header .brand { font-weight:700; letter-spacing:.3px; font-size:15px; }
    header .brand span { color:var(--accent); }
    header nav { display:flex; flex-wrap:wrap; align-items:center; gap:2px; }
    header nav a { position:relative; color:var(--muted); text-decoration:none; white-space:nowrap;
      font-size:14px; font-weight:500; padding:8px 13px; border-radius:9px;
      transition:color .18s var(--ease), background .18s var(--ease); }
    header nav a:hover { color:var(--fg); background:rgba(255,255,255,.05); }
    header nav a.on { color:var(--fg); background:var(--accent-tint); }
    header nav a.on::after { content:''; position:absolute; left:13px; right:13px; bottom:3px;
      height:2px; border-radius:2px; background:linear-gradient(90deg,var(--accent),var(--accent2)); }
    header form { margin-left:8px; }
    @media(max-width:600px){
      header { padding:11px 14px; }
      header nav { gap:1px; }
      header nav a, header nav button { font-size:13px; padding:7px 10px; }
      main { padding:18px 14px !important; }
    }

    main { max-width:1060px; margin:0 auto; padding:30px 24px 60px;
      animation:pageIn .45s var(--ease-out) both; }
    @keyframes pageIn { from { opacity:0; transform:translateY(8px); } to { opacity:1; transform:none; } }
    @media (prefers-reduced-motion: reduce){ main { animation:none; } }

    /* ── typography ── */
    h1 { font-size:25px; font-weight:700; letter-spacing:-.02em; margin:0 0 20px; }
    h2 { letter-spacing:-.01em; }
    .muted { color:var(--muted); } .accent { color:var(--accent); }
    small.k { color:var(--muted); }
    a { color:var(--accent2); text-decoration:none; transition:color .15s; }
    a:hover { color:var(--accent); }

    /* ── surfaces ── */
    .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
    .thumb { width:100%; border-radius:var(--r-sm); border:1px solid var(--line); display:block; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .post, .card, form.inline {
      background:linear-gradient(180deg,var(--panel-2),var(--panel));
      border:1px solid var(--line); border-radius:var(--r-lg);
      box-shadow:var(--sh-1); }
    .post { padding:18px 20px; margin-bottom:18px; }
    .cards { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:24px; }
    .card { padding:16px 18px; min-width:132px; }
    .card .n { font-size:28px; font-weight:700; letter-spacing:-.02em; }
    .card .l { color:var(--muted); font-size:13px; }
    form.inline { padding:20px; margin-bottom:20px; }

    /* ── forms ── */
    label { display:block; font-size:12.5px; font-weight:500; color:var(--muted); margin:12px 0 5px; }
    input, textarea, select { width:100%; background:var(--bg-2); border:1px solid var(--line);
      color:var(--fg); border-radius:var(--r-sm); padding:11px 13px; font:inherit;
      transition:border-color .16s var(--ease), box-shadow .16s var(--ease), background .16s; }
    input::placeholder, textarea::placeholder { color:var(--faint); }
    input:hover, textarea:hover, select:hover { border-color:var(--line-2); }
    input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent);
      box-shadow:var(--ring); background:var(--bg); }
    textarea { min-height:82px; resize:vertical; line-height:1.5; }
    input[type=checkbox]{ width:auto; accent-color:var(--accent); }

    /* ── buttons ── */
    button { font:inherit; font-weight:600; cursor:pointer; margin-top:14px;
      color:var(--accent-ink); border:0; border-radius:var(--r-sm); padding:11px 18px;
      background:linear-gradient(180deg,#8fd8fb,var(--accent));
      box-shadow:0 1px 0 rgba(255,255,255,.25) inset, var(--sh-1);
      transition:transform .12s var(--ease), box-shadow .18s var(--ease), filter .18s; }
    button:hover { filter:brightness(1.06); box-shadow:0 1px 0 rgba(255,255,255,.3) inset, 0 6px 18px -6px var(--accent-glow); }
    button:active { transform:translateY(1px) scale(.99); }
    button:disabled { opacity:.5; cursor:default; filter:none; box-shadow:none; }
    button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line-2);
      box-shadow:none; }
    button.ghost:hover { border-color:var(--accent-line); background:rgba(255,255,255,.04); filter:none; }

    /* ── misc ── */
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:left; padding:10px 12px; border-bottom:1px solid var(--line); font-size:14px; }
    th { color:var(--muted); font-weight:500; font-size:12.5px; letter-spacing:.03em; text-transform:uppercase; }
    tr { transition:background .12s; }
    tbody tr:hover { background:rgba(255,255,255,.02); }
    .pill { font-size:12px; padding:3px 10px; border-radius:20px; border:1px solid var(--line-2);
      color:var(--muted); }
    .flash { background:linear-gradient(180deg,rgba(79,195,247,.14),rgba(79,195,247,.06));
      border:1px solid var(--accent-line); color:#dff2fd; padding:11px 15px;
      border-radius:var(--r); margin-bottom:16px; box-shadow:var(--sh-1); }

    /* ── shared modal shell (opt-in via .sheet / .sheet-card) ── */
    .sheet { position:fixed; inset:0; z-index:60; display:none; padding:16px;
      align-items:center; justify-content:center;
      background:rgba(4,6,9,.66); backdrop-filter:blur(4px); -webkit-backdrop-filter:blur(4px);
      animation:sheetIn .2s var(--ease) both; }
    .sheet.on { display:flex; }
    .sheet-card { background:linear-gradient(180deg,var(--panel-2),var(--panel));
      border:1px solid var(--line-2); border-radius:var(--r-xl); box-shadow:var(--sh-pop);
      padding:22px 24px; width:min(460px,96vw); max-height:90vh; overflow:auto;
      animation:cardIn .26s var(--ease-out) both; }
    @keyframes sheetIn { from { opacity:0; } to { opacity:1; } }
    @keyframes cardIn { from { opacity:0; transform:translateY(12px) scale(.98); } to { opacity:1; transform:none; } }
    /* utility: any element (e.g. a JS-toggled modal card) animates in when shown */
    .pop { animation:cardIn .26s var(--ease-out) both; }
    @media (prefers-reduced-motion: reduce){ .sheet, .sheet-card, .pop { animation:none; } }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <div class="brand">CHR<span>GD</span> · Content Studio</div>
    <nav>
      <a href="/create" class="{{ 'on' if active=='create' }}">Create</a>
      <a href="/calendar" class="{{ 'on' if active=='calendar' }}">Calendar</a>
      <a href="/queue" class="{{ 'on' if active=='queue' }}">Queue{% if queue_active %} <span style="color:var(--accent)">●{{ queue_active }}</span>{% endif %}</a>
      <a href="/backlog" class="{{ 'on' if active in ('backlog','build','trends','review','export','dashboard') }}">Library{% if review_count %} ({{ review_count }}){% endif %}</a>
      <a href="/settings" class="{{ 'on' if active=='settings' }}">Settings</a>
      <form method="post" action="/logout" style="display:inline">
        <button class="ghost" style="margin:0;padding:7px 13px">Log out</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
