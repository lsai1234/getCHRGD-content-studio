<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}CHRGD Content Studio{% endblock %}</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' rx='3' fill='%23FF6A00'/%3E%3Ctext x='8' y='12' font-size='10' font-weight='bold' text-anchor='middle' fill='%23111'%3EC%3C/text%3E%3C/svg%3E">
  <style>
    :root { --bg:#0B0B0D; --panel:#151519; --line:#26262c; --fg:#f2f2f2;
            --muted:#9a9aa2; --accent:#FF6A00; --accent2:#FFC400; }
    * { box-sizing:border-box; }
    body { margin:0; font:15px/1.5 -apple-system,Segoe UI,Roboto,Helvetica,Arial,sans-serif;
           background:var(--bg); color:var(--fg); }
    header { display:flex; align-items:center; justify-content:space-between;
             flex-wrap:wrap; gap:10px;
             padding:14px 22px; border-bottom:1px solid var(--line); background:#0f0f12; }
    header .brand { font-weight:700; letter-spacing:.5px; }
    header .brand span { color:var(--accent); }
    header nav { display:flex; flex-wrap:wrap; align-items:center; gap:6px 14px; }
    header nav a { color:var(--muted); text-decoration:none; white-space:nowrap; }
    header nav a:hover { color:var(--fg); }
    header nav a.on { color:var(--fg); border-bottom:2px solid var(--accent); padding-bottom:4px; }
    @media(max-width:600px){
      header { padding:12px 14px; }
      header nav { gap:4px 10px; }
      header nav a, header nav button { font-size:13px; }
      main { padding:18px 14px; }
    }
    .grid { display:grid; grid-template-columns:repeat(5,1fr); gap:12px; }
    .thumb { width:100%; border-radius:8px; border:1px solid var(--line); display:block; }
    .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; }
    .post { background:var(--panel); border:1px solid var(--line); border-radius:12px;
            padding:16px 18px; margin-bottom:18px; }
    input[type=checkbox]{ width:auto; }
    small.k { color:var(--muted); }
    main { max-width:1040px; margin:0 auto; padding:26px 22px; }
    h1 { font-size:22px; margin:0 0 18px; }
    .cards { display:flex; gap:14px; flex-wrap:wrap; margin-bottom:24px; }
    .card { background:var(--panel); border:1px solid var(--line); border-radius:12px;
            padding:16px 18px; min-width:130px; }
    .card .n { font-size:28px; font-weight:700; }
    .card .l { color:var(--muted); font-size:13px; }
    .accent { color:var(--accent); }
    form.inline { background:var(--panel); border:1px solid var(--line);
                  border-radius:12px; padding:18px; margin-bottom:20px; }
    label { display:block; font-size:13px; color:var(--muted); margin:10px 0 4px; }
    input, textarea, select { width:100%; background:#0d0d10; border:1px solid var(--line);
            color:var(--fg); border-radius:10px; padding:10px 12px; font:inherit;
            transition:border-color .15s, box-shadow .15s; }
    input:focus, textarea:focus, select:focus { outline:none; border-color:var(--accent);
            box-shadow:0 0 0 3px rgba(255,106,0,.15); }
    textarea { min-height:80px; resize:vertical; }
    button { background:linear-gradient(180deg, #ff7d1f, var(--accent)); color:#111;
             border:0; border-radius:10px; padding:10px 18px; font-weight:600;
             cursor:pointer; margin-top:14px;
             transition:filter .15s, transform .1s; }
    button:hover { filter:brightness(1.1); }
    button:active { transform:scale(.98); }
    button.ghost { background:transparent; color:var(--fg); border:1px solid var(--line); }
    button.ghost:hover { border-color:var(--accent); filter:none; }
    table { width:100%; border-collapse:collapse; margin-top:8px; }
    th, td { text-align:left; padding:8px 10px; border-bottom:1px solid var(--line);
             font-size:14px; }
    th { color:var(--muted); font-weight:500; }
    .pill { font-size:12px; padding:2px 8px; border-radius:20px; border:1px solid var(--line); }
    .flash { background:#2a1a0a; border:1px solid var(--accent); color:#ffcfa3;
             padding:10px 14px; border-radius:8px; margin-bottom:16px; }
    .muted { color:var(--muted); }
    a { color:var(--accent2); }
  </style>
</head>
<body>
  {% if user %}
  <header>
    <div class="brand">CHR<span>GD</span> · Content Studio</div>
    <nav>
      <a href="/create" class="{{ 'on' if active=='create' }}">Create</a>
      <a href="/calendar" class="{{ 'on' if active=='calendar' }}">Calendar</a>
      <a href="/queue" class="{{ 'on' if active=='queue' }}">Queue{% if queue_active %} <span style="color:var(--accent)">●{{ queue_active }}</span>{% endif %}</a>
      <a href="/backlog" class="{{ 'on' if active in ('backlog','build','trends','review','export','dashboard') }}">Library{% if review_count %} ({{ review_count }}){% endif %}</a>
      <form method="post" action="/logout" style="display:inline">
        <button class="ghost" style="margin:0;padding:6px 12px">Log out</button>
      </form>
    </nav>
  </header>
  {% endif %}
  <main>
    {% block body %}{% endblock %}
  </main>
</body>
</html>
